name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          name="asiri-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}"
          go build -trimpath \
            -ldflags "-s -w -X github.com/gingered-cat/asiri/internal/server.Version=${GITHUB_REF_NAME}" \
            -o "dist/${name}" ./cmd/asiri
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  # The Touch ID helper is Swift and needs Apple's SDK, so it builds on macOS.
  touchid:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the Touch ID helper (arm64, amd64)
        run: |
          for arch in arm64 amd64; do
            go run ./dev touchid -arch "$arch" -o "dist/asiri-touchid-${GITHUB_REF_NAME}-darwin-${arch}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: binary-touchid
          path: dist/*

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags
        id: tags
        shell: bash
        run: |
          image="ghcr.io/gingered-cat/asiri"
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            {
              echo 'tags<<EOF'
              echo "$image:$tag"
              echo "$image:$minor"
              echo "$image:latest"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          elif [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            # A prerelease must not replace a stable minor channel or latest.
            echo "tags=$image:$tag" >> "$GITHUB_OUTPUT"
          else
            echo "invalid release tag: $tag" >&2
            exit 1
          fi
      - uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.tags.outputs.tags }}

  publish:
    needs: [binaries, touchid, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: |
          cd dist
          sha256sum asiri-* > checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # This job has no checkout, so name the repository explicitly.
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*
